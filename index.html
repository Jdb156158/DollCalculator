<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c9d8ff" />
    <meta name="description" content="和棉棉兔一起玩的中文玩偶计算器" />
    <title>玩偶计算器 · 棉棉兔</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game" id="game" data-doll="rabbit">
      <h1 class="sr-only">玩偶计算器</h1>
      <div class="rays" aria-hidden="true"></div>
      <canvas id="backdropCanvas" aria-hidden="true"></canvas>
      <div class="sparkle-field" aria-hidden="true"></div>
      <div class="twinkles" aria-hidden="true"></div>

      <section class="hud" aria-label="游戏进度">
        <div class="hud-row">
          <div class="progress-dots" id="progressDots" aria-label="共十题"></div>
          <div class="goal-pill"><span>已用时间</span><strong id="timer">0:00</strong></div>
          <button class="sound-button" id="soundButton" type="button" aria-label="关闭音效" aria-pressed="true">♫</button>
        </div>
        <div class="hud-row hud-row-second">
          <div class="tallies">
            <span class="tally">答对 <strong id="correctCount">0</strong><small>/10</small></span>
            <span class="tally">再试 <strong id="missCount">0</strong></span>
          </div>
          <div class="combo-pill" id="comboPill" aria-live="polite" hidden><strong id="comboCount">2</strong> 连击!</div>
          <div class="joy-pill"><span>快乐值</span><strong id="joyCount">0</strong></div>
          <button class="settings-button" id="settingsButton" type="button" aria-label="打开设置">⚙</button>
        </div>
      </section>

      <section class="stage" id="stage" aria-label="棉棉兔和星星玩偶">
        <svg class="bunting" viewBox="0 0 500 45" preserveAspectRatio="none" aria-hidden="true">
          <path d="M-8 5 Q250 49 508 5" fill="none" stroke="#182047" stroke-width="2.5" stroke-linecap="round"/>
          <g stroke="#182047" stroke-width="2" stroke-linejoin="round">

            <path d="M110 22h21l-11 16z" fill="#ffe58a"/><path d="M150 25h21l-10 16z" fill="#b4ecd8"/>
            <path d="M190 28h21l-10 15z" fill="#b999ff"/><path d="M230 29h21l-10 15z" fill="#ff89b8"/>
            <path d="M270 28h21l-10 15z" fill="#5c7dff"/><path d="M310 25h21l-10 16z" fill="#ffe58a"/>
            <path d="M350 22h21l-11 16z" fill="#8ce7d1"/><path d="M390 17h21l-10 17z" fill="#b999ff"/>
            <path d="M430 10h21l-10 15z" fill="#ff89b8"/>
          </g>
        </svg>
        <div class="spotlight spotlight-left" aria-hidden="true"></div>
        <div class="spotlight spotlight-right" aria-hidden="true"></div>
        <div class="beat-rings" aria-hidden="true"></div>
        <div class="stage-glow" aria-hidden="true"></div>
        <div class="plush-group" id="plushGroup">
          <div class="star-friend" aria-hidden="true"><span class="star-face">•ᴗ•</span></div>
          <svg class="plush" viewBox="0 0 240 228" role="img" aria-label="原创玩偶棉棉兔">
            <g class="doll-variant" data-doll="rabbit">

            </g>
            <g class="doll-variant" data-doll="bear" stroke="#1b2048" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="120" cy="207" rx="80" ry="8" fill="#7086c1" opacity=".23" stroke="none"/>
              <circle cx="67" cy="62" r="27" fill="#d89665"/><circle cx="173" cy="62" r="27" fill="#d89665"/>
              <circle cx="67" cy="62" r="14" fill="#ffbbab" stroke-width="2"/><circle cx="173" cy="62" r="14" fill="#ffbbab" stroke-width="2"/>

              <path d="M155 194 Q167 194 168 203 Q166 212 149 213 Q137 213 135 202Z" fill="#eab06f"/>
              <path d="M109 48 Q120 36 131 48 L126 60 L114 60Z" fill="#fff0a6" stroke-width="2.5"/>
            </g>
            <g class="doll-variant" data-doll="cat" stroke="#1b2048" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="120" cy="207" rx="80" ry="8" fill="#7086c1" opacity=".23" stroke="none"/>
              <path d="M165 178 Q195 158 200 181 Q204 198 185 198" fill="none" stroke="#1b2048" stroke-width="18"/>
              <path d="M165 178 Q195 158 200 181 Q204 198 185 198" fill="none" stroke="#e9f1ff" stroke-width="12"/>
              <path d="M78 90 L53 30 Q50 20 61 25 L103 54Z" fill="#e9f1ff"/>
              <path d="M162 90 L187 30 Q190 20 179 25 L137 54Z" fill="#e9f1ff"/>
              <path d="M74 72 L63 42 L91 61Z M166 72 L177 42 L149 61Z" fill="#ffafc7" stroke-width="2"/>
              <path d="M81 157 Q69 170 75 195 Q85 210 120 210 Q155 210 165 195 Q171 170 159 157Z" fill="#e9f1ff"/>
              <path d="M82 173 Q120 190 158 173 L156 202 Q120 216 84 202Z" fill="#b6a7ef"/>
              <path d="M86 177 Q120 198 154 177" fill="none" stroke="#8c7acb" stroke-width="2"/>
              <path d="M110 187 L120 177 L130 187 L120 198Z" fill="#fff0a6" stroke-width="2.2"/>

              <path d="M72 83 Q120 49 168 83" fill="none" stroke="#fff" stroke-width="4"/>

              <ellipse cx="153" cy="132" rx="12" ry="8" fill="#ffbad5" stroke="none"/>

              <path d="M114 118 Q120 113 126 118 Q120 125 114 118Z" fill="#f691b0" stroke-width="2"/>
              <path d="M120 122 Q119 131 112 131 M120 122 Q121 131 128 131" fill="none" stroke-width="2.5"/>
              <path d="M58 117 L78 120 M58 126 L78 124 M162 120 L182 117 M162 124 L182 126" fill="none" stroke-width="2"/>
              <path d="M85 194 Q73 194 72 203 Q74 212 91 213 Q103 213 105 202Z" fill="#a8bde9"/>
              <path d="M155 194 Q167 194 168 203 Q166 212 149 213 Q137 213 135 202Z" fill="#a8bde9"/>
              <path d="M109 57 Q96 46 97 57 Q99 68 116 65 L120 59 Q124 68 141 65 Q144 46 131 57 L120 59Z" fill="#76d9d2" stroke-width="2.5"/>
              <circle cx="120" cy="60" r="5" fill="#ffe590" stroke-width="2"/>
            </g>
          </svg>
        </div>
        <svg class="ground" viewBox="0 0 460 12" preserveAspectRatio="none" aria-hidden="true"><path d="M5 7 Q120 2 230 7 T455 7" fill="none" stroke="#1b2048" stroke-width="2.6" stroke-linecap="round"/></svg>
      </section>

      <section class="question-card" id="questionCard" aria-label="计算题">
        <div class="card-heading"><span class="category" id="category">减法小练习</span><strong id="questionNumber">第 1 题</strong></div>
        <div class="equation" id="equation" aria-label="14 减 5 等于多少">
          <span id="leftNumber">14</span><span class="operator" id="operator">−</span><span id="rightNumber">5</span><span class="operator">=</span><span class="answer" id="answerSlots"></span>
        </div>
        <p class="feedback" id="feedback" role="status" aria-live="polite">点按数字，帮棉棉兔找答案</p>
        <div class="success-stamp" id="successStamp" aria-hidden="true">答对啦!</div>
      </section>

      <section class="keypad" aria-label="数字键盘" id="keypad">
        <button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button>
        <button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button>
        <button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button>
        <button type="button" class="delete-key" data-action="delete" aria-label="删除错误数字">⌫</button><button type="button" class="zero-key" data-digit="0">0</button>
      </section>

      <svg class="arm-layer" id="armLayer" aria-hidden="true">
        <g class="arm" data-side="left"><path class="arm-outline"/><path class="arm-fill"/><circle class="arm-hand" r="8"/><g class="held-token" visibility="hidden"><circle r="17"/><text text-anchor="middle" dominant-baseline="central"></text></g></g>
        <g class="arm" data-side="right"><path class="arm-outline"/><path class="arm-fill"/><circle class="arm-hand" r="8"/><g class="held-token" visibility="hidden"><circle r="17"/><text text-anchor="middle" dominant-baseline="central"></text></g></g>
      </svg>

      <div class="impact-flash" aria-hidden="true"></div>
      <div class="settings-overlay" id="settingsOverlay" hidden>
        <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
          <div class="settings-heading">
            <div><p class="settings-eyebrow">和棉棉兔一起玩</p><h2 id="settingsTitle">游戏设置 ✦</h2></div>
            <button type="button" class="settings-close" id="settingsClose" aria-label="关闭设置">×</button>
          </div>
          <p class="settings-intro">选择小朋友的年龄，题目会更合适。</p>
          <div class="age-options" role="group" aria-label="选择年龄">
            <button type="button" class="age-option" data-age="4-5" aria-pressed="false"><span class="age-icon">★</span><span class="age-copy"><strong>4–5 岁</strong><small>10 以内加减法</small></span><span class="age-check" aria-hidden="true">✓</span></button>
            <button type="button" class="age-option" data-age="6-7" aria-pressed="true"><span class="age-icon">✿</span><span class="age-copy"><strong>6–7 岁</strong><small>20 以内加减法</small></span><span class="age-check" aria-hidden="true">✓</span></button>
            <button type="button" class="age-option" data-age="8+" aria-pressed="false"><span class="age-icon">✦</span><span class="age-copy"><strong>8 岁以上</strong><small>100 以内加减法</small></span><span class="age-check" aria-hidden="true">✓</span></button>
          </div>
          <h3 class="doll-heading">选择玩偶 <small>随时切换</small></h3>
          <div class="doll-options" role="group" aria-label="选择玩偶">
            <button type="button" class="doll-option" data-doll="rabbit" aria-pressed="true">
              <svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="21" cy="17" rx="8" ry="17" fill="#fff8ee" stroke="#1b2048" stroke-width="2"/><ellipse cx="43" cy="17" rx="8" ry="17" fill="#fff8ee" stroke="#1b2048" stroke-width="2"/><circle cx="32" cy="40" r="22" fill="#fff8ee" stroke="#1b2048" stroke-width="2"/><circle cx="25" cy="39" r="2" fill="#1b2048"/><circle cx="39" cy="39" r="2" fill="#1b2048"/><circle cx="32" cy="46" r="3" fill="#f790ac"/></svg>
              <strong>棉棉兔</strong><span aria-hidden="true">✓</span>
            </button>
            <button type="button" class="doll-option" data-doll="bear" aria-pressed="false">
              <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="17" cy="20" r="10" fill="#d89665" stroke="#1b2048" stroke-width="2"/><circle cx="47" cy="20" r="10" fill="#d89665" stroke="#1b2048" stroke-width="2"/><circle cx="32" cy="39" r="23" fill="#f4c58e" stroke="#1b2048" stroke-width="2"/><circle cx="25" cy="38" r="2" fill="#1b2048"/><circle cx="39" cy="38" r="2" fill="#1b2048"/><ellipse cx="32" cy="47" rx="9" ry="6" fill="#fff2dc"/><circle cx="32" cy="45" r="3" fill="#9e5a62"/></svg>
              <strong>布丁熊</strong><span aria-hidden="true">✓</span>
            </button>
            <button type="button" class="doll-option" data-doll="cat" aria-pressed="false">
              <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M10 34 L14 7 L29 22 M54 34 L50 7 L35 22" fill="#e9f1ff" stroke="#1b2048" stroke-width="2" stroke-linejoin="round"/><circle cx="32" cy="40" r="22" fill="#e9f1ff" stroke="#1b2048" stroke-width="2"/><circle cx="25" cy="39" r="2" fill="#1b2048"/><circle cx="39" cy="39" r="2" fill="#1b2048"/><circle cx="32" cy="45" r="3" fill="#f691b0"/><path d="M14 44 L22 46 M42 46 L50 44" stroke="#1b2048" stroke-width="2"/></svg>
              <strong>泡泡猫</strong><span aria-hidden="true">✓</span>
            </button>
          </div>
          <p class="settings-note" id="settingsNote">切换年龄会重新开始十题；玩偶立即切换</p>
          <button type="button" class="settings-done" id="settingsDone">回到游戏</button>
        </section>
      </div>
      <div class="result-overlay" id="resultOverlay" hidden>
        <div class="result-panel" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
          <div class="result-star">✦</div>
          <p class="result-eyebrow">十题挑战完成</p>
          <h2 id="resultTitle">你和棉棉兔太棒啦！</h2>
          <p class="result-score"><strong id="finalJoy">0</strong><span>快乐值</span></p>
          <div class="result-stats"><span>答对 <strong id="finalCorrect">10</strong> 题</span><span>再试 <strong id="finalMiss">0</strong> 次</span><span>用时 <strong id="finalTime">0:00</strong></span></div>
          <button type="button" id="replayButton" class="replay-button">再玩一次 ✦</button>
        </div>
      </div>
      <canvas id="confettiCanvas" aria-hidden="true"></canvas>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
